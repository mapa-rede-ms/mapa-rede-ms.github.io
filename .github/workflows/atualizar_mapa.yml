name: Atualizar Mapa Rede MSGAS

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Extrair rede oficial e gerar index.html
        run: python gerar_mapa_html.py --output index.html --no-cache-save

      - name: Publicar se houver alteração na rede
        run: |
          if git diff --quiet index.html; then
            echo "Sem alterações na rede oficial."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "chore: atualizar rede oficial MSGÁS automaticamente"
            git push
          fi
